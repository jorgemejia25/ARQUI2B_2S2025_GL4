# Configuración de Mosquitto MQTT Broker para Railway
# Permitir conexiones anónimas
allow_anonymous true

# Configurar listener para puerto 1883 (MQTT estándar)
listener 1883
bind_address 0.0.0.0
allow_anonymous true

# Configurar listener para puerto 9001 (WebSocket)
listener 9001
bind_address 0.0.0.0
protocol websockets
allow_anonymous true

# Configuración de persistencia
persistence true
persistence_location /mosquitto/data/

# Configuración adicional para múltiples conexiones
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000

# Configuración de logging
log_dest stdout
log_type all
