version: '3.8'

services:
  # Broker MQTT (Mosquitto)
  mosquitto:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # Servicio MQTT que simula el Arduino
  mqtt-service:
    build:
      context: .
      dockerfile: Dockerfile.mqtt
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    restart: unless-stopped

  # API FastAPI
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8001:8001"
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8001
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  data:
