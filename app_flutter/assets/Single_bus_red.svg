<?xml version="1.0" encoding="UTF-8"?>
<!-- Bus individual rojo para animación
     Bus centrado en el SVG para facilitar transformaciones
     Dimensiones compactas: 60x40 (con padding)
     Este SVG completo se moverá y rotará con Flutter
-->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" width="60" height="40" viewBox="0 0 60 40">
  <title>Bus Rojo Animado</title>
  <desc>Bus de prueba en rojo para animación de circuito</desc>
  
  <!-- Bus rojo centrado en el SVG -->
  <rect x="7.5" y="9" width="45" height="22" 
        fill="#FF0000" 
        stroke="#FFFFFF" 
        stroke-width="2" 
        rx="3" 
        ry="3">
    <title>Bus Test</title>
  </rect>
  
  <!-- Ícono de bus (opcional, para mejor visualización) -->
  <circle cx="30" cy="20" r="6" fill="#FFFFFF" opacity="0.8"/>
</svg>
