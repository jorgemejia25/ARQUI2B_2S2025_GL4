# Configuración de Mosquitto para el proyecto de Seguridad de Tráfico
# Arquitectura de Software 2

# =================================================================
# Configuración General
# =================================================================

# Permitir conexiones anónimas para desarrollo local
allow_anonymous true

# Configuración de logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# Configuración de persistencia
persistence true
persistence_location ./mosquitto_data
persistence_file mosquitto.db
autosave_interval 300

# =================================================================
# Listeners
# =================================================================

# Listener principal en puerto 1883 (MQTT estándar)
listener 1883 0.0.0.0

# Listener para WebSockets en puerto 9001
listener 9001 0.0.0.0
protocol websockets

# =================================================================
# Configuración de Seguridad
# =================================================================

# Configuración básica de seguridad
max_connections 100
max_inflight_messages 20
max_queued_messages 1000

# Configuración de mensajes
message_size_limit 1048576
max_packet_size 1048576

# =================================================================
# Configuración específica del proyecto
# =================================================================

# Habilitar mensajes de conexión en logs
connection_messages true

# Configuración de QoS
max_qos 2

# Configuración de keepalive
max_keepalive 300

# Configuración de sys_interval para monitoreo
sys_interval 30
