# Configuración de Mosquitto MQTT Broker para acceso público
listener 1883 0.0.0.0
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# WebSocket support para acceso público
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# Configuración adicional para acceso público
max_connections 1000
max_inflight_messages 100
max_queued_messages 1000
